<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="shell-type" content="web_standard" />
    <title>Order Confirmed | NAURIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#03140e",
                        "primary-container": "#172923",
                        "secondary-container": "#fe7f3c",
                        background: "#fef9ee",
                        "on-surface-variant": "#424845"
                    },
                    fontFamily: {
                        headline: ["Playfair Display"],
                        body: ["Plus Jakarta Sans"]
                    }
                }
            }
        };
    </script>
    <script src="site.js" defer></script>
</head>
<body class="min-h-screen bg-background font-body text-primary antialiased">
    <main class="mx-auto flex min-h-screen max-w-3xl items-center justify-center px-6 py-16">
        <section class="w-full rounded-2xl bg-white p-8 text-center shadow-lg sm:p-12" aria-labelledby="confirmation-title">
            <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-primary-container text-white">
                <span class="material-symbols-outlined text-3xl" aria-hidden="true">check</span>
            </div>
            <p class="mb-2 text-sm font-bold uppercase tracking-widest text-secondary-container">NAURIO order update</p>
            <h1 id="confirmation-title" class="font-headline text-4xl font-semibold">Your order is confirmed</h1>
            <p class="mt-4 text-base leading-7 text-on-surface-variant">Thank you. Your demo order has been recorded in this browser. Payment and fulfilment are not connected to a backend.</p>
            <p class="mt-4 text-sm text-on-surface-variant">Order reference: <strong id="order-reference">NAU-DEMO</strong></p>
            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
                <a class="rounded-full bg-secondary-container px-6 py-3 font-semibold text-white" href="order-tracking-page.html">Track Order</a>
                <a class="rounded-full bg-primary-container px-6 py-3 font-semibold text-white" href="design1web.html">Continue Exploring</a>
            </div>
        </section>
    </main>
    <script>
        const order = window.NaurioSite && window.NaurioSite.getOrder();
        if (order && order.id) document.getElementById("order-reference").textContent = order.id;
    </script>
</body>
</html>
